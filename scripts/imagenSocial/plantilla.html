<!doctype html>
<!--
  Plantilla de la imagen que se ve al compartir la web (WhatsApp, Instagram,
  LinkedIn, X…). No se publica: la usa «generar.sh» para sacar un PNG de
  1200 × 630, que es el tamaño que piden todas esas plataformas.

  El idioma se elige con «?lang=es» o «?lang=en» en la dirección.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; right: -180px; top: -120px; width: 820px; height: 820px;
    background: radial-gradient(circle, #e62b36 0%, transparent 62%); opacity: .32; filter: blur(20px);
  }
  .content { position: absolute; left: 72px; top: 64px; width: 640px; }
  .logo { height: 44px; }
  h1 {
    margin-top: 56px; font-size: 92px; font-weight: 800; line-height: .95; letter-spacing: -.045em;
  }
  h1 span { color: #e62b36; }
  p { margin-top: 28px; font-size: 28px; line-height: 1.35; color: rgba(235,235,245,.62); max-width: 560px; }
  .stores { margin-top: 36px; font-size: 22px; font-weight: 600; color: rgba(235,235,245,.8); }
  .bubble {
    position: absolute; border-radius: 50%; overflow: hidden;
    box-shadow: 0 12px 48px var(--c), 0 2px 10px rgba(0,0,0,.5);
  }
  .bubble img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <img class="logo" src="../../public/brand/logo-completo-fondo-oscuro.svg" alt="" />
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <p class="stores">App Store · Google Play</p>
  </div>

  <!-- Las mismas cinco personas de la portada, con el halo de su deporte. -->
  <div class="bubble" style="--c: rgba(255,69,58,.55); width: 190px; height: 190px; left: 780px; top: 70px;">
    <img src="../../public/perfiles/gimnasio.jpg" style="object-position: 76% 34%; transform: scale(1.3);" alt="" />
  </div>
  <div class="bubble" style="--c: rgba(255,159,10,.55); width: 170px; height: 170px; left: 990px; top: 150px;">
    <img src="../../public/perfiles/running.jpg" style="object-position: 41% 12%; transform: scale(1.35); transform-origin: 41% 12%;" alt="" />
  </div>
  <div class="bubble" style="--c: rgba(191,90,242,.55); width: 160px; height: 160px; left: 740px; top: 290px;">
    <img src="../../public/perfiles/calistenia.jpg" style="object-position: 35% 10%; transform: scale(2.6); transform-origin: 35% 10%;" alt="" />
  </div>
  <div class="bubble" style="--c: rgba(94,92,230,.55); width: 180px; height: 180px; left: 930px; top: 360px;">
    <img src="../../public/perfiles/hyrox.jpg" style="object-position: 56% 42%; transform: scale(1.5); transform-origin: 56% 42%;" alt="" />
  </div>
  <div class="bubble" style="--c: rgba(64,200,224,.55); width: 140px; height: 140px; left: 830px; top: 470px;">
    <img src="../../public/perfiles/ciclismo.jpg" style="object-position: 40% 27%; transform: scale(2.6); transform-origin: 40% 27%;" alt="" />
  </div>

  <script>
    const copy = {
      es: {
        title: 'Encuentra con quién <span>entrenar.</span>',
        subtitle: 'Cada día, cinco personas que entrenan cerca de ti, con tus deportes y tu horario.',
      },
      en: {
        title: 'Find someone to <span>train with.</span>',
        subtitle: 'Every day, five people who train near you, with your sports and your schedule.',
      },
    };
    const language = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es';
    document.getElementById('title').innerHTML = copy[language].title;
    document.getElementById('subtitle').textContent = copy[language].subtitle;
  </script>
</body>
</html>
