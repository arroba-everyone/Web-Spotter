# Configuración de Netlify. Está en el repositorio y no en su panel web para que
# quede a la vista, con historial, y para que un sitio nuevo se monte igual.
# Sintaxis: https://docs.netlify.com/build/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # La misma versión mínima que pide Astro 7 en package.json.
  NODE_VERSION = "22"

# Los ficheros de «_astro» llevan un código en el nombre que cambia cada vez que
# cambia su contenido. Por eso el navegador los puede guardar un año sin
# preguntar: si cambian, el nombre es otro. Ahorra peticiones y ancho de banda,
# que en el plan gratuito de Netlify se paga en créditos.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeceras básicas de seguridad para todas las páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
